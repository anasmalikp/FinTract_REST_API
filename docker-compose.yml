version: '3.4'

services:
  fintract_rest_api:
    image: ${DOCKER_REGISTRY-}fintractrestapi
    build:
      context: .
      dockerfile: FinTract_REST_API/Dockerfile
    ports:
      - "8080:80"  # Map port 80 in the container to port 8080 on the host
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinTrack;User=sa;Password=StrongP@ssw0rd;TrustServerCertificate=True;
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "StrongP@ssw0rd"  # Set a strong password here
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
